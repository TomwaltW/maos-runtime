# MAOS T27 · 本地单机 broker —— 只为跑通「换 MQ 不改上层」的等价性证明，不是生产配置。
brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH

# proxy 与 broker 在同一 docker 网络里，broker 要把这个名字注册给 namesrv，
# 否则 proxy 拿到的是容器内网 IP，跨重启就失效。
brokerIP1 = rmqbroker

# 单机演示：topic 与订阅组都自动建。生产要关掉，改用 mqadmin 显式建。
autoCreateTopicEnable = true
autoCreateSubscriptionGroup = true

# 🔴 等价性证明的前提：默认写队列数改成 1。
# RocketMQ 普通消息只保证「单队列内有序」，多队列下同一串 publish 会被散列到不同队列，
# 消费顺序与投递顺序不一致 —— 那样比对的就不是「后端语义」而是「队列数」。
# 单队列下单生产者单消费者的顺序是确定的，这条配置写在这里而不是藏在测试里。
defaultTopicQueueNums = 1
