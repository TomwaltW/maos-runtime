[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maos-runtime"
version = "0.1.0"
description = "MAOS —— 多 Agent 协作运行时（复赛演示实现，核心零依赖）"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
hiclaw = ["matrix-nio"]
obs = ["opentelemetry-sdk"]
dev = ["pytest"]
# PG 后端（maos/store/pg_store.py）。**可选**：核心 dependencies 恒为 []，
# 不装它 sqlite 后端照跑，PG 路径显式抛 PgBackendUnavailable 而不是静默回落。
# 模块级不 import psycopg，只在 `_driver()` 里惰性 import —— 装不装都不影响导入。
pg = ["psycopg[binary]>=3.1"]

[tool.setuptools.packages.find]
include = ["maos*", "hiclaw*"]

[tool.pytest.ini_options]
testpaths = ["maos/tests"]
