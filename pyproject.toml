[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maos-runtime"
version = "0.1.0"
description = "MAOS —— 多 Agent 协作运行时（复赛演示实现，核心零依赖）"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
hiclaw = ["matrix-nio"]
obs = ["opentelemetry-sdk"]
dev = ["pytest"]
# PG 后端（maos/store/pg_store.py）。**可选**：核心 dependencies 恒为 []，
# 不装它 sqlite 后端照跑，PG 路径显式抛 PgBackendUnavailable 而不是静默回落。
# 模块级不 import psycopg，只在 `_driver()` 里惰性 import —— 装不装都不影响导入。
pg = ["psycopg[binary]>=3.1"]

# IM 渠道接入（maos/ingress/）。**可选**：飞书把应用后台的 Encrypt Key 留空即
# 明文回调，标准库就够，不装它飞书整条链路照跑；企业微信 / 微信客服的回调**强制
# AES 加密**，缺这一项时 `crypto._aes_backend()` 显式抛 ChannelDepMissing 而不是
# 静默回落 —— 取向与 pg 后端一致（静默回落的症状是「群里发了没反应」）。
# pycryptodome 也认，见 `maos/ingress/crypto.py::_aes_backend`。
ingress = ["cryptography>=41"]

[tool.setuptools.packages.find]
include = ["maos*", "hiclaw*"]

[tool.pytest.ini_options]
testpaths = ["maos/tests"]
