# 本地 Nacos（standalone，内嵌 derby）—— 只为在本机把「四个旋钮从环境变量搬进
# 可动态治理的配置面」这条链路跑通，**不是生产部署样例**。
#
# 铁律 6：这个文件里不许出现任何口令。三个 auth 相关的值一律从**进程环境变量**取，
# 缺省值只在 `MAOS_NACOS_*` 未设时兜底，且兜底值本身是公开的演示值 —— 换句话说，
# 「不配就是不安全」这件事写在脸上，而不是藏在一个看起来像密钥的字面量里。
#
#   export NACOS_AUTH_TOKEN=<自己生成的 base64，原文至少 32 字节>
#   export NACOS_AUTH_IDENTITY_KEY=<任意串>
#   export NACOS_AUTH_IDENTITY_VALUE=<任意串>
#   docker compose -f deploy/nacos/docker-compose.yml up -d
#
# 生成 token 的一条命令（不写进任何文件，只 export）：
#   openssl rand -base64 48
#
# 端口只绑 127.0.0.1：这台机器上跑的是一个带审批人名单的治理面，
# 默认绑 0.0.0.0 等于把「谁能批钱」这张表挂到局域网上。

services:
  nacos:
    image: nacos/nacos-server:v2.4.3
    container_name: maos-nacos
    environment:
      MODE: standalone
      # 单机内嵌 derby，不外挂 MySQL —— 本地演示不需要，也少一个要配口令的面。
      SPRING_DATASOURCE_PLATFORM: ""
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN: "${NACOS_AUTH_TOKEN:?需要先 export NACOS_AUTH_TOKEN（base64，原文 >= 32 字节）}"
      NACOS_AUTH_IDENTITY_KEY: "${NACOS_AUTH_IDENTITY_KEY:?需要先 export NACOS_AUTH_IDENTITY_KEY}"
      NACOS_AUTH_IDENTITY_VALUE: "${NACOS_AUTH_IDENTITY_VALUE:?需要先 export NACOS_AUTH_IDENTITY_VALUE}"
      NACOS_AUTH_TOKEN_EXPIRE_SECONDS: "18000"
      JVM_XMS: 512m
      JVM_XMX: 512m
      JVM_XMN: 256m
    ports:
      - "127.0.0.1:8848:8848"   # 控制台 / OpenAPI
      - "127.0.0.1:9848:9848"   # 客户端 gRPC（nacos-sdk-python v2 走这条）
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8848/nacos/v1/console/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
